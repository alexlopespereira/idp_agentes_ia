# Calendario da turma IA-2026-01 (Agentes de IA).
#
# Esta e a fonte da matricula E do cronograma: estar listado em `exercicios:`
# abaixo e o que matricula a turma no exercicio. O YAML do exercicio nao
# decide mais data nenhuma — ele e so conteudo pedagogico.
#
# Entrada vazia herda `padrao:`. Para dar prazo diferente a um exercicio,
# abra a chave e declare so o campo que muda:
#
#   ia-3.1:
#     fecha: 2026-10-27T23:59:59-03:00
#
# `abre` bloqueia a submissao (`exercise_not_open_yet`); `fecha` so marca
# `late`, nao impede entrega.
#
# Abrir a turma seguinte = copiar este arquivo com outro nome e outras datas.
# Este aqui nao precisa ser tocado nunca mais, e por isso as datas de 2026-01
# nao correm o risco de serem sobrescritas pelas de 2026-02 (foi exatamente
# isso que marcou toda a aula 1 com 107 dias de atraso em setembro/2026).

turma: IA-2026-01

