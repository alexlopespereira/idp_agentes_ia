exercicio: "ia-1.2"
titulo: "GitHub CLI"
turmas:
  - IA-2026-01
disponivel_a_partir_de: 2026-05-01T00:00:00-03:00
prazo:
  recomendado_ate: 2026-05-31T23:59:59-03:00
# Comandos shell que o CLI executa e que o backend valida (string equality).
# Placeholder {owner_repo} é substituído pelo CLI a partir do repo_url.
comandos_shell:
  - ["gh", "--version"]
  - ["gh", "auth", "status"]
  - ["gh", "repo", "view", "{owner_repo}", "--json", "visibility,name,isPrivate"]
# Balanço da nota: 70 pontos nos critérios objetivos + 30 na pergunta de
# reflexão (soma 100 — o boletim usa a soma crua dos pesos, não normaliza).
# Quem entrega o repo certo mas não explica o que fez fica com 7,0; a
# compreensão vale mais do que executar os comandos no piloto automático.
# Ao editar pesos aqui, refaça a conta: criterios + perguntas TEM que dar 100.
criterios:
  - id: repo_publico
    peso: 12
    check: github.repo.public
  - id: pelo_menos_1_pr
    peso: 15
    check: github.pr.count
    args:
      state: all
      min: 1
  - id: pr_titulo_descritivo
    peso: 11
    check: github.pr.has_descriptive_title
  - id: gh_authenticated
    peso: 12
    check: evidence.shell.gh_auth_ok
  - id: gh_version_capturado
    peso: 8
    check: evidence.shell.gh_version_present
  - id: gh_repo_view_ok
    peso: 12
    check: evidence.shell.gh_repo_view_ok
perguntas:
  - texto: "O que você entendeu dos comandos que acabou de executar?"
    criterios_avaliacao: |
      Resposta deve demonstrar compreensão de pelo menos 2 dos comandos do gh CLI
      usados no exercício (gh auth login, gh repo view, gh pr create, etc.) e
      explicar com palavras próprias o que cada comando citado faz. Aceitar
      respostas em linguagem informal; rejeitar respostas evasivas ou copy-paste
      do enunciado.
    peso: 30